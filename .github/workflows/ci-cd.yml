name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

       - run: npm test

       - run: npm run test:jest

       - name: Notify success
         if: success()
         run: 'curl -X POST -H ''Content-type: application/json'' --data ''{"content": "New Version uploaded"}'' ${{ secrets.DISCORD_WEBHOOK_URL }}'
         continue-on-error: true

      - name: Notify failure
        if: failure()
        run: 'curl -X POST -H ''Content-type: application/json'' --data ''{"content": "❌ RaidPresence CI failed"}'' ${{ secrets.DISCORD_WEBHOOK_URL }}'
        continue-on-error: true