# GitHub Actions CI/CD Workflow for RaidPresence
# 
# This workflow automatically triggers on every push to main branch
# and orchestrates the CI/CD pipeline. It:
# 1. Checks out the code from the repository
# 2. Sets up Node.js environment
# 3. Installs dependencies
# 4. Runs TypeScript compilation checks (npm test)
# 5. Notifies Discord of success or failure
# 6. Blocks deployment if tests fail (Railway waits for this to pass)
#
# Once this workflow succeeds, Railway's integration automatically
# deploys the build without requiring manual intervention.

name: CI/CD Pipeline

# Trigger configuration: run on every push to main branch
on:
  push:
    branches:
      - main

jobs:
  # Single job that runs all CI/CD checks and validation
  test-and-validate:
    # Run on the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      # Uses GitHub's official checkout action (v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      # Uses v18.x for compatibility with project dependencies
      # Enables npm cache for faster dependency installation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      # Step 3: Install dependencies using npm ci
      # npm ci (clean install) is preferred in CI environments as it:
      # - Installs exact versions from package-lock.json
      # - Ensures reproducible builds
      # - Fails fast if package-lock.json is out of sync
      - name: Install dependencies
        run: npm ci

      # Step 4: Run TypeScript compilation checks
      # Executes: npm test -> tsc --noEmit
      # This validates TypeScript type safety without emitting output files
      # Fails the workflow if any TypeScript compilation errors are detected
       - name: Run tests (TypeScript type checks)
         run: npm test

       # Step 5: Notify Discord on success
       # Sends a success notification to Discord webhook
       - name: Notify Discord on success
         if: success()
         run: |
           PAYLOAD='{
             "content": "✅ **RaidPresence CI/CD Pipeline Succeeded**",
             "embeds": [{
               "title": "Build Passed on '"${{ github.ref_name }}"'",
               "description": "Tests passed successfully during CI/CD pipeline execution",
               "color": 65280,
               "fields": [
                 {"name": "Repository", "value": "'"${{ github.repository }}"'", "inline": true},
                 {"name": "Branch", "value": "'"${{ github.ref_name }}"'", "inline": true},
                 {"name": "Commit Message", "value": "'"${{ github.event.head_commit.message }}"'", "inline": false},
                 {"name": "Author", "value": "'"${{ github.event.head_commit.author.name }}"'", "inline": true},
                 {"name": "Workflow URL", "value": "['"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"' ](View Run)", "inline": false}
               ]
             }]
           }'
           curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.DISCORD_WEBHOOK_URL }}
         continue-on-error: true

       # Step 6: Notify Discord on failure
       # Sends a failure notification to Discord webhook
       - name: Notify Discord on failure
         if: failure()
         run: |
           PAYLOAD='{
             "content": "❌ **RaidPresence CI/CD Pipeline Failed**",
             "embeds": [{
               "title": "Build Failed on '"${{ github.ref_name }}"'",
               "description": "Tests failed during CI/CD pipeline execution",
               "color": 16711680,
               "fields": [
                 {"name": "Repository", "value": "'"${{ github.repository }}"'", "inline": true},
                 {"name": "Branch", "value": "'"${{ github.ref_name }}"'", "inline": true},
                 {"name": "Commit Message", "value": "'"${{ github.event.head_commit.message }}"'", "inline": false},
                 {"name": "Author", "value": "'"${{ github.event.head_commit.author.name }}"'", "inline": true},
                 {"name": "Workflow URL", "value": "['"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"' ](View Run)", "inline": false}
               ]
             }]
           }'
           curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.DISCORD_WEBHOOK_URL }}
         continue-on-error: true
