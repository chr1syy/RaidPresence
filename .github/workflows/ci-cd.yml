name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run test:jest

      - name: Notify success
        if: success()
        run: 'curl -X POST -H ''Content-type: application/json'' --data ''{"content": "✅ RaidPresence CI passed${{ startsWith(github.ref, ''refs/tags/v'') && format('' — building Docker image for {0}...'' , github.ref_name) || '''' }}"}'' ${{ secrets.DISCORD_WEBHOOK_URL }}'
        continue-on-error: true

      - name: Notify failure
        if: failure()
        run: 'curl -X POST -H ''Content-type: application/json'' --data ''{"content": "❌ RaidPresence CI failed"}'' ${{ secrets.DISCORD_WEBHOOK_URL }}'
        continue-on-error: true

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chr1syy/raidpresence
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Docker success
        if: success()
        run: 'curl -X POST -H ''Content-type: application/json'' --data ''{"content": "🐳 RaidPresence ${{ github.ref_name }} published — upgrade ready\nghcr.io/chr1syy/raidpresence:${{ github.ref_name }}"}'' ${{ secrets.DISCORD_WEBHOOK_URL }}'
        continue-on-error: true

      - name: Notify Docker failure
        if: failure()
        run: 'curl -X POST -H ''Content-type: application/json'' --data ''{"content": "❌ RaidPresence ${{ github.ref_name }} Docker build failed"}'' ${{ secrets.DISCORD_WEBHOOK_URL }}'
        continue-on-error: true
