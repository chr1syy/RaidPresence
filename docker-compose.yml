services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: raidpresence
      POSTGRES_USER: raidpresence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raidpresence"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    image: ghcr.io/chr1syy/raidpresence:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://raidpresence:${POSTGRES_PASSWORD}@postgres:5432/raidpresence
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
      GUILD_ID: ${GUILD_ID:-}
      RAID_LEADER_ROLES: ${RAID_LEADER_ROLES:-}
      # Optional: unset means the bot never contacts Top.gg (see docs/guides/TOPGG-INTEGRATION.md)
      TOPGG_TOKEN: ${TOPGG_TOKEN:-}
      TOPGG_WEBHOOK_SECRET: ${TOPGG_WEBHOOK_SECRET:-}
      TOPGG_WEBHOOK_PORT: ${TOPGG_WEBHOOK_PORT:-8080}
    # The vote webhook needs a public HTTPS URL, so the port belongs behind the reverse
    # proxy that already terminates TLS — not published straight to the host. Uncomment
    # only if you intend to expose it directly. Left commented so merging this changes
    # nothing about the host's listening ports.
    # ports:
    #   - "127.0.0.1:${TOPGG_WEBHOOK_PORT:-8080}:${TOPGG_WEBHOOK_PORT:-8080}"

volumes:
  pgdata:
